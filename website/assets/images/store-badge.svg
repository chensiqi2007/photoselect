      <stop offset="0%" stop-color="#181e2b"/>
      <stop offset="100%" stop-color="#0e131d"/>
    </linearGradient>
  </defs>
  <rect width="216" height="64" rx="8" fill="url(#badgeBg)" stroke="#334155" stroke-width="1.2"/>
  
  <!-- Microsoft 4-Color Tiles -->
