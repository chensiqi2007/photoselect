<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eyeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#eyeBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="12" font-weight="700" letter-spacing="1.5">NARRATIVE SELECT STYLE · 468-POINT EYE INSPECTION</text>
  </g>

  <!-- Left: Whole Face Mesh Simulation (MediaPipe 468 landmarks) -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="220" height="280" rx="12" fill="#131926" stroke="#334155" stroke-width="1"/>
    
    <!-- Face Contour -->
    <ellipse cx="110" cy="140" rx="65" ry="90" fill="#1c2538"/>
    
    <!-- Facial Mesh Polygon Grid (MediaPipe style) -->
    <!-- Eyes -->
    <ellipse cx="85" cy="120" rx="16" ry="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <ellipse cx="135" cy="120" rx="16" ry="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    
    <!-- Eye Landmark dots -->
    <circle cx="85" cy="120" r="4" fill="#38bdf8"/>
    <circle cx="135" cy="120" r="4" fill="#38bdf8"/>
    
    <!-- Nose line -->
    <path d="M 110 115 L 110 155 L 102 165 L 118 165 Z" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/>
    <!-- Lips -->
    <path d="M 92 190 Q 110 182 128 190 Q 110 205 92 190 Z" fill="none" stroke="#64748b" stroke-width="1"/>

    <!-- Mesh Wireframe Accents -->
    <polygon points="110,65 85,100 110,115 135,100" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
    <polygon points="85,120 70,145 110,155 110,115" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
    <polygon points="135,120 150,145 110,155 110,115" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>

    <!-- Left Eye Crop Bounding Box Target -->
    <rect x="68" y="105" width="34" height="30" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="102" y1="120" x2="245" y2="135" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 2"/>

    <!-- Badge -->
    <rect x="15" y="15" width="105" height="22" rx="4" fill="#0b0f19" fill-opacity="0.9"/>
    <text x="67" y="30" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="10" font-weight="bold" text-anchor="middle">离线 MediaPipe</text>
  </g>

  <!-- Right: 100% Macro Eye Inspection Card (Floating & Elevated) -->
  <g transform="translate(300, 75)" filter="url(#eyeGlow)">
    <rect x="0" y="0" width="250" height="280" rx="12" fill="#0f1624" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="250" height="36" rx="12 12 0 0" fill="#172235"/>
    <circle cx="18" cy="18" r="5" fill="#34d399"/>
    <text x="32" y="22" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="12" font-weight="bold">100% 裁切双眼焦点</text>
    <rect x="175" y="8" width="62" height="20" rx="4" fill="#10b981" fill-opacity="0.25"/>
    <text x="206" y="22" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="10" font-weight="bold" text-anchor="middle">锐度 99.4%</text>

    <!-- 100% Real Pixel Eye Crop Viewport -->
    <g transform="translate(18, 50)">
      <rect x="0" y="0" width="214" height="130" rx="8" fill="#182335" stroke="#334155" stroke-width="1"/>
      
      <!-- High-res zoomed eye with eyelashes -->
      <ellipse cx="107" cy="65" rx="58" ry="40" fill="#0e1726"/>
      <circle cx="107" cy="65" r="32" fill="#0284c7"/>
      <circle cx="107" cy="65" r="18" fill="#020617"/>
      <circle cx="114" cy="58" r="6" fill="#f8fafc"/>
      
      <!-- Crisp Eyelash details -->
      <path d="M 60 55 Q 70 35 75 22 M 80 50 Q 90 28 98 16 M 105 48 Q 115 25 120 12 M 130 50 Q 140 28 145 18 M 150 56 Q 160 35 168 25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

      <!-- Crosshair Focus Marker -->
      <circle cx="107" cy="65" r="24" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="107" y1="36" x2="107" y2="42" stroke="#22d3ee" stroke-width="1.5"/>
      <line x1="107" y1="88" x2="107" y2="94" stroke="#22d3ee" stroke-width="1.5"/>
      <line x1="78" y1="65" x2="84" y2="65" stroke="#22d3ee" stroke-width="1.5"/>
      <line x1="130" y1="65" x2="136" y2="65" stroke="#22d3ee" stroke-width="1.5"/>
    </g>

    <!-- Inspection Metrics -->
    <g transform="translate(18, 195)">
      <text x="0" y="14" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11">眨眼判断: <tspan fill="#34d399" font-weight="bold">睁开 (正常)</tspan></text>
      <text x="0" y="34" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11">左右眼锐度: <tspan fill="#38bdf8" font-weight="bold">左 99.4% · 右 97.8%</tspan></text>
      
      <!-- Progress Bar -->
      <rect x="0" y="44" width="214" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="44" width="212" height="6" rx="3" fill="#10b981"/>

      <text x="0" y="68" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="10">快捷键 [Z] 一键展开 · 告别一张张手动缩放</text>
    </g>
  </g>
</svg>
