<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#compBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="12" font-weight="700" letter-spacing="1.5">SYNCHRONIZED DUAL COMPARE VIEW · [A] VS [B]</text>
  </g>

  <!-- Left Photo [A] Baseline -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="245" height="250" rx="10" fill="#171e2c" stroke="#10b981" stroke-width="2"/>
    
    <!-- Header Tag -->
    <rect x="12" y="12" width="90" height="24" rx="4" fill="#10b981"/>
    <text x="57" y="28" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11" font-weight="bold" text-anchor="middle">基准图 [A]</text>

    <!-- Simulated Scene (Portrait Smile with Sharp Eyes) -->
    <ellipse cx="122" cy="130" rx="50" ry="65" fill="#1f2d42"/>
    <ellipse cx="105" cy="118" rx="8" ry="5" fill="#38bdf8"/>
    <ellipse cx="139" cy="118" rx="8" ry="5" fill="#38bdf8"/>
    <path d="M 110 155 Q 122 168 134 155" fill="none" stroke="#f8fafc" stroke-width="2"/>
    
    <!-- Focus Crosshair -->
    <circle cx="105" cy="118" r="14" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Bottom Action Pill -->
    <rect x="12" y="210" width="221" height="28" rx="5" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="122" y="228" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11" font-weight="bold" text-anchor="middle">留用 [A] · 淘汰 [B]</text>
  </g>

  <!-- Central Swap Button & Sync Lock Indicator -->
  <g transform="translate(285, 175)">
    <circle cx="15" cy="15" r="22" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="15" y="19" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="13" font-weight="bold" text-anchor="middle">⇄ S</text>
    <text x="15" y="50" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="9" text-anchor="middle">一键互换</text>
    <text x="15" y="62" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="8" text-anchor="middle">同频缩放平移</text>
  </g>

  <!-- Right Photo [B] Candidate -->
  <g transform="translate(315, 75)">
    <rect x="0" y="0" width="245" height="250" rx="10" fill="#161922" stroke="#ef4444" stroke-width="1.2"/>
    
    <!-- Header Tag -->
    <rect x="12" y="12" width="90" height="24" rx="4" fill="#334155"/>
    <text x="57" y="28" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11" font-weight="bold" text-anchor="middle">候选图 [B]</text>

    <!-- Simulated Scene (Slightly Blurry or Blink) -->
    <ellipse cx="122" cy="130" rx="50" ry="65" fill="#1c202a"/>
    <line x1="97" y1="120" x2="113" y2="120" stroke="#64748b" stroke-width="2"/>
    <line x1="131" y1="120" x2="147" y2="120" stroke="#64748b" stroke-width="2"/>
    <path d="M 112 155 Q 122 150 132 155" fill="none" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Blink Warning -->
    <rect x="135" y="12" width="98" height="24" rx="4" fill="#ef4444" fill-opacity="0.2"/>
    <text x="184" y="28" fill="#f87171" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="10" font-weight="bold" text-anchor="middle">检测到闭眼 ⚠️</text>

    <!-- Bottom Action Pill -->
    <rect x="12" y="210" width="221" height="28" rx="5" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
    <text x="122" y="228" fill="#f87171" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11" font-weight="bold" text-anchor="middle">留用 [B] · 淘汰 [A]</text>
  </g>

  <!-- Bottom Tip -->
  <g transform="translate(50, 355)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11">⚡ 双图 100% 细节同步联动，鼠标滚轮在任意一侧缩放，两侧分毫无差同步放大查看边缘锐度。</text>
  </g>
</svg>
