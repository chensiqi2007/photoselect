<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="burstBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b27"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <filter id="burstGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#burstBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Background Grid Lines -->
  <path d="M 50 0 L 50 400 M 150 0 L 150 400 M 250 0 L 250 400 M 350 0 L 350 400 M 450 0 L 450 400 M 550 0 L 550 400" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>
  <path d="M 0 80 L 600 80 M 0 160 L 600 160 M 0 240 L 600 240 M 0 320 L 600 320" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- SubSecTime Microsecond Waveform / Burst timeline -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="12" font-weight="700" letter-spacing="1.5">SUBSECTIME BURST CLUSTER · 30 FPS</text>
    <line x1="0" y1="18" x2="480" y2="18" stroke="#334155" stroke-width="2"/>
    <!-- Ticks -->
    <circle cx="40" cy="18" r="4" fill="#64748b"/>
    <circle cx="100" cy="18" r="4" fill="#64748b"/>
    <circle cx="160" cy="18" r="4" fill="#64748b"/>
    <circle cx="220" cy="18" r="5" fill="#38bdf8"/>
    <circle cx="280" cy="18" r="7" fill="#10b981" filter="url(#burstGlow)"/>
    <circle cx="340" cy="18" r="5" fill="#38bdf8"/>
    <circle cx="400" cy="18" r="4" fill="#64748b"/>
    <circle cx="460" cy="18" r="4" fill="#64748b"/>
    <text x="280" y="38" fill="#34d399" font-family="JetBrains Mono,monospace" font-size="10" font-weight="bold" text-anchor="middle">BEST SHOT 14:26:08.824</text>
  </g>

  <!-- 3D Stacked Burst Cards Group Demonstration -->
  <g transform="translate(140, 150)" filter="url(#burstGlow)">
    <!-- Back Card 3 -->
    <g transform="translate(48, -24) rotate(6)">
      <rect x="0" y="0" width="220" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <rect x="10" y="10" width="200" height="105" rx="6" fill="#1e293b"/>
    </g>

    <!-- Mid Card 2 -->
    <g transform="translate(24, -12) rotate(3)">
      <rect x="0" y="0" width="220" height="150" rx="10" fill="#131c2e" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
      <rect x="10" y="10" width="200" height="105" rx="6" fill="#1e3a5f"/>
    </g>

    <!-- Front Card (Best Shot Winner) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="240" height="165" rx="12" fill="#152136" stroke="#38bdf8" stroke-width="2.5"/>
      <rect x="10" y="10" width="220" height="115" rx="8" fill="#1c3b63"/>
      
      <!-- Visual Bird / Wildlife Art inside Best Shot -->
      <circle cx="120" cy="65" r="30" fill="#0284c7"/>
      <circle cx="135" cy="55" r="14" fill="#0369a1"/>
      <polygon points="148,52 175,56 148,64" fill="#ef4444"/>
      <circle cx="140" cy="54" r="3" fill="#ffffff"/>
      <!-- Neon Focus Reticle -->
      <circle cx="140" cy="54" r="10" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="2 2"/>

      <!-- Group Indicator Badge -->
      <rect x="160" y="18" width="60" height="22" rx="4" fill="#090d16" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
      <text x="190" y="33" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11" font-weight="700" text-anchor="middle">⧉ 24 连拍</text>

      <!-- Best Shot Green Pill -->
      <rect x="18" y="18" width="80" height="22" rx="4" fill="#059669"/>
      <text x="58" y="33" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="10" font-weight="bold" text-anchor="middle">★ BEST SHOT</text>

      <!-- Bottom Card Info -->
      <text x="16" y="146" fill="#f8fafc" font-family="JetBrains Mono,monospace" font-size="12" font-weight="bold">DSC08492.ARW</text>
      <text x="224" y="146" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11" font-weight="bold" text-anchor="end">留优汰次 [一键]</text>
    </g>
  </g>

  <!-- Right Floating Callout: 64-bit dHash Deduplication -->
  <g transform="translate(420, 240)">
    <rect x="0" y="0" width="150" height="90" rx="8" fill="#0b111e" stroke="#2563eb" stroke-width="1"/>
    <text x="12" y="24" fill="#60a5fa" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="11" font-weight="bold">64-bit dHash 去重</text>
    <text x="12" y="44" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="10">0.5ms 感知哈希指纹</text>
    <text x="12" y="62" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="10">海明距离识别冗余卡顿</text>
    <text x="12" y="78" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,Segoe UI" font-size="10" font-weight="bold">✓ 瞬间淘汰 80% 废片</text>
  </g>
</svg>
